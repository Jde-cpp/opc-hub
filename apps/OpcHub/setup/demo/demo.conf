# The public demo's hub (docs/demo/plan.md Phase 8):  /etc/systemd/system/jde-opchub.service.d/demo.conf, which install-demo.sh
# lays.  The package's unit on the demo's config and args - loopback, the guest, nginx as the trusted front, the PLCs' and the
# seed's certificates - in place of Opc.Hub.jsonnet under args/install.  -sync stays:  args/demo's seeds leave the bundled
# OPC UA server's out, so a start does not bring back the connection the seed purged.  `systemctl revert jde-opchub` undoes it.
# LimitNOFILE:  a visitor is two sockets, and one on a PLC's node browser a session to the PLC with its certificate read
# beside them.  At systemd's 1024 some two hundred of those had the hub out of files, each next one refused.
[Service]
LimitNOFILE=65536
ExecStart=
ExecStart=/opt/jde-cpp/opchub/Jde.Opc.Hub -c -settings=/etc/jde-cpp/apps/OpcHub/config/Opc.Hub.Demo.jsonnet -include=args/demo -sync