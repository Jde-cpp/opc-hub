# The Jde OpcHub Web UI - the Angular site the package puts under /opt/jde-cpp/web - as an nginx site, the counterpart of
# the Windows installer's IIS component (apps/OpcGateway/README.md).  Installed to /etc/jde-cpp, not enabled:
#   sudo ln -s /etc/jde-cpp/nginx-opchub.conf /etc/nginx/sites-enabled/jde-opchub && sudo systemctl reload nginx
# then browse to http://127.0.0.1:8071.  Nothing is proxied: the site reaches the hub itself on localhost:1967
# (web/opc/site/environments/environment.ts).
server {
	listen 8071;
	listen [::]:8071;
	server_name _;
	root /opt/jde-cpp/web;
	index index.html;
	location / {
		try_files $uri $uri/ /index.html =404; # the Angular routes; =404 when the root is gone (apt remove) instead of a redirect cycle's 500
	}
}
