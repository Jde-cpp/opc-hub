# The public demo's front (docs/demo/spec.md "The public origin"): nginx on 443 before a hub that listens on loopback over plain
# HTTP - TLS, the limits and the headers the hub does not have.  For /etc/nginx/sites-enabled, whose files nginx reads inside
# its http block.  The hub side is the demo overlay's: `listenAddress` 127.0.0.1, and http.trustedProxies ["127.0.0.1"], so a
# session is tied to the visitor's address, the last of X-Forwarded-For below, and the sessions pages show it.
#
# The certificate is certbot's, issued before this file is enabled - nginx refuses a config naming a missing file - and renewed
# over port 80's challenge directory, nginx-demo-80.conf beside this file, which also sends port 80 here.
#
# The figures are for the soak to tune.  A first visit fetches every chunk of the site, some hundred files at once, which the
# burst lets through; past it a caller is held to the rate.  The hub mints a session for each call that names none and keeps it
# for http.timeout, so the rate times that timeout bounds how many sessions one address can leave.
limit_req_zone $binary_remote_addr zone=jde_demo_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=jde_demo_conn:10m;
# a call to a socket's path that is no upgrade - the page itself, at / - closes as every other call does
map $http_upgrade $jde_demo_connection {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name opchub.trypoply.com;
	ssl_certificate /etc/letsencrypt/live/opchub.trypoply.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/opchub.trypoply.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	# No location below sets an add_header of its own: one that did would drop the server's three for its answers.
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Frame-Options DENY always;
	# The site carries no nonces, so the inline allowances are for Angular's component styles and the build's inlined critical CSS
	# and its media-swap script.  No origin of Google's sign-in: the site loads those scripts only where a sign-in is offered, and
	# config.json's `login` false offers none here.  fonts.gstatic.com is where the build's inlined font rules fetch Roboto and
	# the Material icons from.  Report-only through the soak: a violation is a console line in the visitor's browser and nothing
	# is blocked.  To enforce it, the opening's step, rename the header to Content-Security-Policy.
	add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://opchub.trypoply.com; frame-ancestors 'none'" always;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/javascript text/css application/json image/svg+xml text/markdown text/plain;

	# nginx's own answer for both is 503
	limit_req_status 429;
	limit_conn_status 429;
	limit_req zone=jde_demo_req burst=300 nodelay;

	proxy_http_version 1.1;
	proxy_set_header Host $host; # the hub's allowOrigin 'sameHost' compares it with the page's Origin
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # the visitor's address last, which is the one the hub reads
	proxy_set_header Connection close; # the hub reads one request per connection

	# The site's config.json is nginx's alone: the port, the banner and `login` false.  The hub has none, so the admin's page
	# through the SSH tunnel, straight from the hub, falls back to the build's environment and keeps its sign-in.  `expires -1`
	# is Cache-Control: no-cache, as the hub sets on its pages, so an edit shows at the next load.
	location = /config.json {
		alias /etc/jde-cpp/demo/config.json;
		expires -1;
	}

	# The app socket, with the page, and the gateway socket.  The hub's sockets idle out at 300 s with a ping at 150 s
	# (libs/web/server/Streams.cpp), so the timeouts sit above that: nginx's 60 s would drop a quiet socket.  A location that
	# sets one header inherits none of the three above, so each names them again.
	location = / {
		proxy_pass http://127.0.0.1:1967;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $jde_demo_connection;
		proxy_read_timeout 330s;
		proxy_send_timeout 330s;
		limit_conn jde_demo_conn 20;
	}
	location = /opc {
		proxy_pass http://127.0.0.1:1967;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $jde_demo_connection;
		proxy_read_timeout 330s;
		proxy_send_timeout 330s;
		limit_conn jde_demo_conn 20;
	}
	# everything else: the site's files, /graphql and the hub's other routes
	location / {
		proxy_pass http://127.0.0.1:1967;
	}
}