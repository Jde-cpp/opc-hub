# The public demo's port 80 (docs/demo/spec.md "The public origin"), apart from nginx-demo.conf's 443 so it can be enabled first:
# nginx refuses a config naming a certificate that does not exist yet, and certbot issues the first one over this challenge
# directory - `certbot certonly --webroot -w /var/www/certbot -d opchub.trypoply.com` - and renews over it.  Everything else is
# sent to https.  setup/demo/install-demo.sh enables this site, issues the certificate, then enables the 443 one.
server {
	listen 80;
	listen [::]:80;
	server_name opchub.trypoply.com;
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}