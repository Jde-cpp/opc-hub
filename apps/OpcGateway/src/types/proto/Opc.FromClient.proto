syntax = "proto3";
package Jde.Opc.FromClient;
import "Opc.Common.proto";
import "Common.proto";
import "google/protobuf/timestamp.proto";

//Part 4's DataChangeFilter, as a Subscribe asks it per node (spec *Watch list*):  when the item reports - 0 Status, 1 StatusValue,
//2 StatusValueTimestamp, unset StatusValue, the server's default - and the deadband a value change has to clear, 0 None,
//1 Absolute in the value's units, 2 Percent of the node's EURange, which the server applies or refuses with the status the ack
//carries.  The gateway refuses the Subscribe, naming the node, for a trigger or type outside these, a deadband value below 0 or
//not a number, or a percent over 100.  The trigger is optional since proto3's zero is Status:  a filter sent for its deadband alone would report no value change.
message DataChangeFilter{
	optional uint32 trigger=1;
	uint32 deadband_type=2;
	double deadband_value=3;
}
//What a node's item asks its server for.  Unset:  the gateway's defaults, 500 ms, a queue of one, discard oldest, no filter.
message MonitoringParameters{
	optional double sampling_interval=1;//ms;  0 is the server's fastest, negative the subscription's publishing interval.
	optional uint32 queue_size=2;
	optional bool discard_oldest=3;
	DataChangeFilter filter=4;
}
//Nodes to watch on a connection, each with the parameters at its position in `parameters` - fewer than nodes, or none, means
//the defaults for the rest.  A node another listener of the connection watches shares its item, which takes the strictest of
//what they ask (spec *Watch list*):  the ack carries the item's revised values as they are when it answers, and a
//MonitoredItemModified push what a later join or leave changes them to, or that the server refused the change.  Subscribing
//a node again, with other parameters, is how a listener changes what it asks.
message Subscribe{
	string opc_id=1;
	repeated Jde.Opc.Proto.NodeId nodes=2;
	repeated MonitoringParameters parameters=3;
}

message Unsubscribe{
	string opc_id=1;
	repeated Jde.Opc.Proto.NodeId nodes=2;
}

//An event subscription (spec *Events*):  an event monitored item on `node`, an object or view whose EventNotifier has the
//SubscribeToEvents bit - the Server object always has it - with an EventFilter of the eight base fields, EventId, EventType,
//SourceNode, SourceName, Time, ReceiveTime, Message and Severity, then the browse paths `select` names, each a path below the
//event type, "Rpm", "2:Rpm" or "EnabledState/Id", a segment's namespace index before its name and 0 without one, and no where
//clause.  The gateway refuses the message for a path it cannot read.  Answered by a SubscriptionAck of one result, and then an
//EventValues per event, under request id 0 as a NodeValues is, one Value per field in this order.  A node another listener of
//the connection subscribes shares its item, whose select clauses are the union of every listener's;  subscribing the node again
//with another `select` is how a listener changes its list.
message SubscribeEvents{
	string opc_id=1;
	Jde.Opc.Proto.NodeId node=2;
	repeated string select=3;
}
//Ends an event subscription:  answered by an UnsubscribeAck naming the node under successes or failures.
message UnsubscribeEvents{
	string opc_id=1;
	Jde.Opc.Proto.NodeId node=2;
}

//A historian subscription (spec *Subscriptions*):  a group's nodes, each as hist_group_nodes spells it, with its namespace
//URI, or by the index the group's server has for that URI, as a browsed node is, and from when.  The reply is the history
//from from_time to now, paged, then every record stored after, as it is stored.  Without from_time the history is each
//node's value now, as the bound, and what follows.  The message's request_id names the subscription from then on.
message HistSubscribe{
	uint32 group=1;//the hist_groups id.
	repeated Jde.Opc.Proto.ExpandedNodeId nodes=2;
	google.protobuf.Timestamp from_time=3;
}
//Ends a historian subscription, by the request_id of its HistSubscribe.
message HistUnsubscribe{
	uint32 subscription=1;
}
//A machine's live OEE (oee spec *Live*), or a line's, one of the two:  answered by an OeeSubscribeAck with its status now, then
//an OeeStatus whenever its state changes, at once, and every /gateway/oee/live at most while anything else of it does;  a
//line's when a machine it reaches changes state or closes an interval, every /gateway/oee/live at most.  The message's
//request_id names the subscription from then on.
message OeeSubscribe{
	uint32 machine=1;//the oee_machines id.
	uint32 line=2;//the oee_lines id.
}
//Ends a live OEE subscription, by the request_id of its OeeSubscribe.
message OeeUnsubscribe{
	uint32 subscription=1;
}

message Message{
	uint32 request_id = 1;
	oneof Value{
		string session_id = 2;
		Jde.Proto.Query query=3;
		Subscribe subscribe = 4;
		Unsubscribe unsubscribe = 5;
		HistSubscribe hist_subscribe = 6;
		HistUnsubscribe hist_unsubscribe = 7;
		SubscribeEvents subscribe_events = 8;
		UnsubscribeEvents unsubscribe_events = 9;
		OeeSubscribe oee_subscribe = 10;
		OeeUnsubscribe oee_unsubscribe = 11;
	}
}

message Transmission{
	repeated Message messages=1;
}