syntax = "proto3";
package Jde.Opc.Gateway.FromServer;
import "Opc.Common.proto";
import "Common.proto";
import "google/protobuf/timestamp.proto";

message MonitoredItemCreateResult{
  uint32 status_code=1;
  double revised_sampling_interval=2;
  uint32 revised_queue_size=3;
  Jde.Opc.Proto.NodeId node=4;//the node this result answers - the gateway answers in NodeId order, never the request's (reviews/m3-closing.md #10)
}

message SubscriptionAck{
	repeated MonitoredItemCreateResult results=1;
}

message NodeValues{
	string opc_id=1;
	Jde.Opc.Proto.NodeId node=2;
	Jde.Opc.Proto.Value value=3;//the whole reading:  an array is its `array` member, with its type and dimensions.  No member = an empty Variant.
	uint32 sc=4;//the UA_DataValue's quality - one per reading, even when the value is an array.  0 = Good.  The gateway's own code, with no value, when it cannot convert the value.
	google.protobuf.Timestamp source=5;//the reading's timestamps, those the server sent:  the history trend places a push after the read by source time.
	google.protobuf.Timestamp server=6;
}

message UnsubscribeAck{
	repeated Jde.Opc.Proto.NodeId successes=1;
	repeated Jde.Opc.Proto.NodeId failures=2;
}

message Message{
	uint32 request_id = 1;
	oneof Value{
		uint32 ack = 2;	//SocketSessionId
		string query = 3; //GraphQL Query Response
		NodeValues node_values = 4; //Subscription Broadcast
		Jde.Proto.Exception exception = 5;
		SubscriptionAck subscription_ack = 6; //Subscription acknowledgement
		UnsubscribeAck unsubscribe_ack = 7; //Unsubscribe acknowledgement
	}
}

message Transmission{
	repeated Message messages=1;
}
