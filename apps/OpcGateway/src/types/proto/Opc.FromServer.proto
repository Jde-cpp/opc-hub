syntax = "proto3";
package Jde.Opc.Gateway.FromServer;
import "Opc.Common.proto";
import "Common.proto";
import "google/protobuf/timestamp.proto";

message MonitoredItemCreateResult{
  uint32 status_code=1;
  double revised_sampling_interval=2;
  uint32 revised_queue_size=3;
  Jde.Opc.Proto.NodeId node=4;//the node this result answers - the gateway answers in NodeId order, never the request's (reviews/m3-closing.md #10)
}

message SubscriptionAck{
	repeated MonitoredItemCreateResult results=1;
}

message NodeValues{
	string opc_id=1;
	Jde.Opc.Proto.NodeId node=2;
	Jde.Opc.Proto.Value value=3;//the whole reading:  an array is its `array` member, with its type and dimensions.  No member = an empty Variant.
	uint32 sc=4;//the UA_DataValue's quality - one per reading, even when the value is an array.  0 = Good.  The gateway's own code, with no value, when it cannot convert the value.
	google.protobuf.Timestamp source=5;//the reading's timestamps, those the server sent:  the history trend places a push after the read by source time.
	google.protobuf.Timestamp server=6;
}

message UnsubscribeAck{
	repeated Jde.Opc.Proto.NodeId successes=1;
	repeated Jde.Opc.Proto.NodeId failures=2;
}
//A node's item was modified for a listener's join or leave (spec *Watch list*):  every listener of the node hears what the server
//revised it to, since a SubscriptionAck answers one Subscribe alone.  Or the server refused the modify - status_code says why -
//and the item stands as it was, the revised values what it still runs at;  the next join, leave or Subscribe of the node asks
//again.  Under request_id 0, as NodeValues is.
message MonitoredItemModified{
	string opc_id=1;
	Jde.Opc.Proto.NodeId node=2;
	double revised_sampling_interval=3;
	uint32 revised_queue_size=4;
	uint32 status_code=5;
}

//An event a SubscribeEvents' item delivered (spec *Events*):  one Value per field of the listener's own list, in its order - the
//eight base fields, then the browse paths its `select` named - a Value with no member for a field the event lacks, each
//serialized as a NodeValues' reading is, a structure by its members.  Under request_id 0, as NodeValues is.
message EventValues{
	string opc_id=1;
	Jde.Opc.Proto.NodeId node=2;
	repeated Jde.Opc.Proto.Value fields=3;
}

//A rebuild put a node's event item back on a new subscription (spec *Alarms and conditions*):  the outage's events are gone, so a
//listener that keeps state from them starts over.  Sent only for an event item, under request_id 0 as NodeValues is.
message EventsRestored{
	string opc_id=1;
	Jde.Opc.Proto.NodeId node=2;
}

//A historian record (spec *Record format*), as a subscription's pages and pushes carry it:  a value that passed the
//compression test, a heartbeat, which repeats the value before it, or a Bad_DataLost marker, which holds none.  node is the
//node's place in the HistSubscribe's nodes.
message HistValue{
	uint32 node=1;
	Jde.Opc.Proto.Value value=2;//none for a marker, or a value its file couldn't hold, which sc says.
	uint32 sc=3;//the record's status; 0 is Good.
	google.protobuf.Timestamp source=4;//unset for a value its server sent without one, which is filed by server.
	google.protobuf.Timestamp server=5;
	bool heartbeat=6;
	bool bound=7;//the snapshot's:  the node's value before from_time, or Bad_BoundNotFound at from_time with none.
}
//An edit of a node's history (spec *Edits*), as its modifications file holds it:  what it did at target, and the value it put
//there, none for a delete.
message HistModification{
	uint32 node=1;
	google.protobuf.Timestamp target=2;//the source time it changed.
	uint32 type=3;//Part 11's HistoryUpdateType:  1 insert, 2 replace, 3 update, 4 delete.
	HistValue value=4;
	google.protobuf.Timestamp time=5;//when the edit was made.
	string user=6;
}
//Per node of the HistSubscribe, in its order:  Good for a member, Bad_NodeIdUnknown for a node the group doesn't hold.
message HistSubscribeAck{
	repeated uint32 statuses=1;
}
//A page of the history from from_time to the subscription, in source-time order, each node's bound first, more until the
//last:  the records stored since follow it.
message HistSnapshot{
	repeated HistValue values=1;
	bool more=2;
}
//Stored since the snapshot, as they were stored:  a late record is among them, to be placed by its source time, and a
//modification once it is durable.
message HistRecords{
	repeated HistValue values=1;
	repeated HistModification modifications=2;
}

//A machine's live OEE (oee spec *Live*), or a line's, as an OeeSubscribe's ack and its pushes carry it.
enum EOeeState{
	OeeUnknown=0;//no engine runs the machine, or its signals say nothing.
	OeeRunning=1;
	OeeStopped=2;
}
message OeeReason{
	uint32 id=1;
	string name=2;
	string category=3;//Unplanned, Planned or Excluded.
}
//The stop in progress.
message OeeStop{
	google.protobuf.Timestamp start=1;
	OeeReason reason=2;//the coding's that covers it so far, else its code's;  none for neither.
	bool small=3;//still shorter than the machine's small_stop.
	optional int64 code=4;//the Reason signal's.
}
message OeeShift{
	string name=1;
	google.protobuf.Timestamp start=2;
	google.protobuf.Timestamp end=3;
}
//The figures so far, as the `oee` read answers a bucket:  the times in milliseconds, within planned time.
message OeeFigures{
	google.protobuf.Timestamp start=1;
	google.protobuf.Timestamp end=2;//how far they run:  the engine's time.
	int64 planned=3;
	int64 run=4;
	int64 unplanned=5;
	int64 planned_stop=6;
	int64 small=7;
	int64 excluded=8;
	int64 unknown=9;
	double total=10;
	double good=11;
	double reject=12;
	double outside=13;
	int64 ideal=14;
	optional double availability=15;
	optional double performance=16;
	optional double quality=17;
	optional double oee=18;
	optional double teep=19;
	uint32 measured=20;//the factors in oee, as bits:  1 availability, 2 performance, 4 quality.
	bool partial=21;
	//A line's, as the `oee` read's `machines` and `coverage`:  the machines the figures are over, and how many each factor is.
	uint32 machines=22;
	uint32 performance_coverage=23;
	uint32 quality_coverage=24;
}
//A line's state:  the machines it reaches, by theirs.  One no engine runs is unknown, and a deleted one is in none.
message OeeMachineCounts{
	uint32 running=1;
	uint32 stopped=2;
	uint32 unknown=3;
}
message OeeStatus{
	EOeeState state=1;
	google.protobuf.Timestamp since=2;//when the state began;  unset while no engine runs the machine.
	OeeStop stop=3;//set while stopped.
	bool planned=4;//the instant is inside the machine's planned time:  in a shift and out of its breaks, or always without a calendar.
	OeeShift shift=5;//the calendar's occurrence now;  unset between shifts and without a calendar.
	OeeFigures figures=6;//the shift's so far, or without a calendar the UTC day's;  unset between shifts.
	google.protobuf.Timestamp last_count=7;
	bool calendar_missing=8;//the machine names a calendar the gateway's calendar client doesn't find, so its figures are the UTC day's, as without one.
	//A line's, set for one alone:  its state as counts, for which `state`, `since`, `stop` and `last_count` stay unset.  Its `planned`,
	//`shift` and `calendar_missing` are its own calendar's, and its `figures` its machines' combined over that shift so far.
	OeeMachineCounts machines=9;
}
message OeeSubscribeAck{
	OeeStatus status=1;
}

message Message{
	uint32 request_id = 1;
	oneof Value{
		uint32 ack = 2;	//SocketSessionId
		string query = 3; //GraphQL Query Response
		NodeValues node_values = 4; //Subscription Broadcast
		Jde.Proto.Exception exception = 5;
		SubscriptionAck subscription_ack = 6; //Subscription acknowledgement
		UnsubscribeAck unsubscribe_ack = 7; //Unsubscribe acknowledgement
		HistSubscribeAck hist_subscribe_ack = 8; //a HistSubscribe's, then its HistSnapshot pages and its HistRecords, every message under its request_id.  No Value completes a HistUnsubscribe, as it does a session_id.
		HistSnapshot hist_snapshot = 9;
		HistRecords hist_records = 10;
		MonitoredItemModified monitored_item_modified = 11;
		EventValues event_values = 12; //an event subscription's push, under request id 0 as node_values is.
		EventsRestored events_restored = 13;
		OeeSubscribeAck oee_subscribe_ack = 14; //an OeeSubscribe's, then its OeeStatus pushes, each under its request_id.  No Value completes an OeeUnsubscribe.
		OeeStatus oee_status = 15;
	}
}

message Transmission{
	repeated Message messages=1;
}