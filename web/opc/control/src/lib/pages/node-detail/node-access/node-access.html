@if( !this.isLoading() ){
	<mat-toolbar>
		<button matButton="outlined" [disabled]="!grants.mutations().length" (click)=save()>Save</button>
	</mat-toolbar>
	<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
		[(selectedIndex)]="tabIndex">
		<mat-tab>
			<ng-template mat-tab-label>General</ng-template>
			<ng-template matTabContent>
				<node-rights [rights]=access (toggleEmitter)=onToggle($event) [roles]=grants.roles()></node-rights>
			</ng-template>
		</mat-tab>
	</mat-tab-group>
}
