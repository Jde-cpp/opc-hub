<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
	[(selectedIndex)]="tabIndex">
	<mat-tab><!--a Variable's page lists its own value first, then its children:  its properties and any member variables (clients spec *Address space*)-->
		<ng-template mat-tab-label>Children</ng-template>
		<ng-template matTabContent>
			<node-children [node]="node()" (refreshed)="nodes.set($event)"></node-children>
		</ng-template>
	</mat-tab>
	<mat-tab><!--every attribute of the node's class, the Value with its timestamps, an edit where the UserWriteMask allows (clients spec *Attributes*)-->
		<ng-template mat-tab-label>Attributes</ng-template>
		<ng-template matTabContent>
			<node-attributes [pageData]="pageData()" [node]="node()" (renamed)="rename($event)"></node-attributes>
		</ng-template>
	</mat-tab>
	<mat-tab>
		<ng-template mat-tab-label>References</ng-template>
		<ng-template matTabContent>
			<node-references [pageData]="pageData()" [node]="node()"></node-references>
		</ng-template>
	</mat-tab>
	@if( historizable().length || groups().length ){
		<mat-tab>
			<ng-template mat-tab-label>History</ng-template>
			<ng-template matTabContent>
				<node-history [pageData]="pageData()" [candidates]="historizable()" [groups]="groups()"></node-history>
			</ng-template>
		</mat-tab>
	}
	@if( node().notifiesEvents ){<!--an object or view whose EventNotifier has the SubscribeToEvents bit - the Server object always (clients spec *Events*)-->
		<mat-tab>
			<ng-template mat-tab-label>Events</ng-template>
			<ng-template matTabContent>
				<node-events [pageData]="pageData()" [node]="node()"></node-events>
			</ng-template>
		</mat-tab>
		<mat-tab><!--the same stream kept by ConditionId, with Acknowledge, Confirm and Comment (clients spec *Alarms and conditions*)-->
			<ng-template mat-tab-label>Alarms</ng-template>
			<ng-template matTabContent>
				<node-alarms [pageData]="pageData()" [node]="node()"></node-alarms>
			</ng-template>
		</mat-tab>
	}
	@if( pageData().server.applicationName.startsWith("Jde-Cpp OpcServer") ){
		<mat-tab>
			<ng-template mat-tab-label>Permissions</ng-template>
			<ng-template matTabContent>
				<node-access [accessResource]=pageData().server.accessResource [node]=node()></node-access>
			</ng-template>
		</mat-tab>
	}
</mat-tab-group>
