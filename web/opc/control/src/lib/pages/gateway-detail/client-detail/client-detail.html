<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
	[(selectedIndex)]="tabIndex">
	<mat-tab>
		<ng-template mat-tab-label>Properties</ng-template><!--was the record's name: the same word as the breadcrumb and the side nav, and it re-titled with every keystroke in Name-->
		<ng-template matTabContent>
			<properties [ctor]=ctor [(record)]=properties type=role [schema]=schema [order]=fieldOrder [displayNames]=fieldLabels [readonlyFields]="isNew ? [] : ['slug']"></properties>
		</ng-template>
	</mat-tab>
	<!--every connection, saved or not, live or not:  the tab says why one is not connected, and is where Test Connection answers-->
	<mat-tab>
		<ng-template mat-tab-label>Connection</ng-template>
		<ng-template matTabContent>
				<server-properties [server]="server()" [error]="serverError()" [untested]="untested" [connecting]="testing()" [staleFor]="staleFor()"></server-properties>
		</ng-template>
	</mat-tab>
</mat-tab-group>
<detail-actions [page]="this"><!--Purge too:  a deleted connection keeps its slug, and the create refusal says to restore or purge it (reviews/install-issues.md #51, #53)-->
	<!--beside the two safe actions, outlined like Cancel:  it saves nothing - at most it issues the slug's certificate, as the saved connection's first connect would.
		disabledInteractive, so pressing it keeps the focus there (WCAG 2.4.3) instead of dropping it to the body;  onTestClick checks canTest itself-->
	<button matButton="outlined" (click)="onTestClick()" [disabled]="!canTest()" disabledInteractive>{{ testing() ? "Testing…" : "Test Connection" }}</button>
</detail-actions>
