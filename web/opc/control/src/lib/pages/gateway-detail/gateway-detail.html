@if( !isLoading() ){
	<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
		[selectedIndex]="tabIndex"
		(selectedIndexChange)="tabIndexChanged($event)">
		<mat-tab>
			<ng-template mat-tab-label>Connections</ng-template>
			<ng-template matTabContent>
				<ql-list [(sideNav)]=sideNav></ql-list>
			</ng-template>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Logs</ng-template>
			<ng-template matTabContent>
				@for( g of [gateway()]; track g ){<!--keyed on the gateway:  the router reuses this page from one to the next, and a tab loads once (reviews/m3-closing.md #31)-->
					<log-detail [service]=g!></log-detail>
				}
			</ng-template>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Log Settings</ng-template>
			<ng-template matTabContent>
				@if( instanceId() !== undefined ){
					@for( id of [instanceId()]; track id ){<!--keyed, as Logs:  a Save used to diff against the previous gateway's snapshot and write to this one's id-->
						<log-settings [service]=appService [instanceId]=id!></log-settings>
					}
				}
				@else{
					<p>No application instance registered for this gateway — log settings are unavailable.</p>
				}
			</ng-template>
		</mat-tab>
	</mat-tab-group>
}
