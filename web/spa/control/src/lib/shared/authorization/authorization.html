
<!-- <div class="g-signin2" id="google-button"></div> -->

@if( !providers.isLoading() ) {
	@if( user()?.picture ){
		<button type="button" class="account" (click)="onLogout()" [attr.aria-label]="signOutLabel()" [matTooltip]="signOutLabel()">
			@if( picture() ){
				<img class="profile-picture" [src]="picture()" alt="" referrerpolicy="no-referrer" (error)="onPictureError()">
			}
			@else {
				<mat-icon>account_circle</mat-icon>
			}
		</button>
	}
	@else if( user()?.name ){
		<button mat-button type="button" (click)="onLogout()" [attr.aria-label]="signOutLabel()" [matTooltip]="signOutLabel()">
			{{`${user()?.domain}/${user()?.name}`}}
		</button>
	}
	@else {
		<a matIconButton routerLink="login" routerLinkActive="docs-navbar-header-item-selected" aria-label="Sign in" matTooltip="Sign in">
			<mat-icon routerLinkActive="selected">account_circle</mat-icon>
		</a>
	}
}
