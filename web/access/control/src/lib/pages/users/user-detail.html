@if( !this.isLoading() ){
	<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
		[(selectedIndex)]="tabIndex">
		<mat-tab>
			<ng-template mat-tab-label>Properties</ng-template>
			<ng-template matTabContent>
				@if( isKeyProvider() ){
					<key-properties [(record)]=properties [schema]=schema [readonlyFields]=readonlyFields></key-properties>
				}
				@else{
					<properties [ctor]=ctor [(record)]=properties type=user [schema]=schema [excludedColumns]=excludedColumns [order]=fieldOrder [readonlyFields]=readonlyFields></properties>
				}
			</ng-template>
		</mat-tab>
		@if( user.id ){
			<mat-tab>
				<ng-template mat-tab-label>Groups</ng-template>
				<ng-template matTabContent>
					<ql-selector type=Group [ql]=ql [(selections)]=groups></ql-selector>
				</ng-template>
			</mat-tab>
			<mat-tab>
				<ng-template mat-tab-label>Roles</ng-template>
				<ng-template matTabContent>
					<ql-selector type=Role [ql]=ql [(selections)]=roles ></ql-selector>
				</ng-template>
			</mat-tab>
			<!--no direct Permissions tab (MVP):  a direct acl grant on a user is a third way to the same right that bypasses roles
				and is invisible from anywhere but this page - rights are granted through Roles, as the node Access tab already
				does.  The rows still round-trip (`permissions` in upsert) so an existing grant is never dropped by Save.
				What the user ends up with, direct grants included, is the read-only tab below.-->
			<mat-tab>
				<ng-template mat-tab-label>Effective rights</ng-template>
				<ng-template matTabContent>
					<effective-rights [holder]="{userId: user.id}" [deleted]="isDeleted"></effective-rights>
				</ng-template>
			</mat-tab>
		}
	</mat-tab-group>
	<detail-actions [page]="this" [canPurge]="false"/>
}
