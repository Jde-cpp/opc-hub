<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
	[selectedIndex]="tabIndex()"
	(selectedIndexChange)="onTabIndexChanged($event)">
	<mat-tab>
		<ng-template mat-tab-label>Properties</ng-template><!--was the role's name: the same word as the breadcrumb and the side nav, and it re-titled with every keystroke in Name-->
		<ng-template matTabContent>
			<properties [ctor]=ctor [(record)]=properties type=role [schema]=schema></properties>
		</ng-template>
	</mat-tab>
	@if( role.id ){
		<mat-tab>
			<ng-template mat-tab-label>Permissions</ng-template>
			<ng-template matTabContent>
				<permission-table [(permissions)]=permissions></permission-table>
			</ng-template>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Roles</ng-template>
			<ng-template matTabContent>
				<ql-selector type=Role [ql]=ql [excludedIds]=[role.id] [(selections)]=childRoles ></ql-selector>
			</ng-template>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Groups</ng-template>
			<ng-template matTabContent>
				<ql-selector type=Group [ql]=ql [(selections)]=groups></ql-selector>
			</ng-template>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Users</ng-template>
			<ng-template matTabContent>
				<ql-selector type=User [ql]=ql [(selections)]=users></ql-selector>
			</ng-template>
		</mat-tab>
	}
</mat-tab-group>
<!--group-detail's row, verbatim.  Two extended fabs gave Cancel the weight of a primary action and the done/cancel icons
	only restated the labels, so the pair is a plain filled/outlined button row;  the trash can is the one icon kept, because
	there it IS the warning.  Pushed to the far side: it sat in the click path of the two safe actions.-->
<div class="jde-detail-actions">
	<button matButton="filled" (click)="onSubmitClick()" [disabled]="!isChanged()">Save</button>
	<button matButton="outlined" (click)="onCancelClick()">Cancel</button>
	@if( isDeleted ){
		<!--only on an already-deleted row, where Restore is the other half of the pair - a live row is never one click from a purge-->
		<button matButton="outlined" class="purge" style="margin-left: auto;" (click)="onPurgeClick()" aria-label="Purge">
			<mat-icon>delete_forever</mat-icon>Purge
		</button>
	}
	<button matButton="outlined" [style.margin-left]="isDeleted ? null : 'auto'" (click)="onDeleteClick()" [disabled]="isNew" [attr.aria-label]="isDeleted ? 'Restore' : 'Delete'">
		<mat-icon>{{isDeleted ? "restore" : "delete"}}</mat-icon>{{isDeleted ? "Restore" : "Delete"}}
	</button>
</div>
