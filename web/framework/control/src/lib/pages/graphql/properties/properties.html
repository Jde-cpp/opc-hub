<div>
	@for( field of fields(); track field.name ){
		<mat-form-field style="width: 100%;" appearance="fill" [class.readonly]="isReadonly(field)"><!--required = the schema's NON_NULL: it puts the asterisk on the label, which is the only hint the user gets for why Save stays disabled on a new record.  Not on a readonly field, which the user cannot fill-->
			<mat-label>{{field.displayName}}</mat-label>
			@if( field.type==InputTypes.Text ){
				<textarea matInput
					[required]="!field.nullable && !isReadonly(field)"
					[readonly]="isReadonly(field)"
					[value]="record()[field.name] ?? ''"
					(input)="onChange( field.name, $any($event.target).value )">
				</textarea>
			}
			@else if( field.type==InputTypes.Select ){
				<mat-select
					[required]="!field.nullable && !isReadonly(field)"
					[disabled]="isReadonly(field)"
					(selectionChange)="onChange( field.name, $event.value )"
					[value]="getEnumId( field )">
					@for( option of field.options; track option.id ){
						<mat-option [value]="option.id">{{option.name}}</mat-option>
					}
				</mat-select>
			}
			@else {<!-- None, Bool, and any future type: a form field must never render without a control -->
				<input #stringField matInput
					[required]="!field.nullable && !isReadonly(field)"
					[readonly]="isReadonly(field)"
					[type]="field.name=='url' ? 'url' : 'text'"
					[attr.cdkFocusInitial]="field.name=='slug' ? '' : null"
					[value]="record()[field.name] ?? ''"
					(input)="onChange( field.name, $any($event.target).value )" >
			}
			@if( fieldError(field); as error ){
				<mat-hint style="color: var(--mat-sys-error)">{{error}}</mat-hint>
			}
		</mat-form-field>
	}
</div>
