<mat-form-field subscriptSizing="dynamic">
	<!-- (selectionChange)="onSelectionChange($event.value)" -->
	<mat-select [value]="level()" (valueChange)="onSelectionChange($event)"><!--not [(value)]: mat-select's value is a plain input/output pair, so the banana box would assign to the model signal-->
		@for( o of options; track o.level ){
			<mat-option [value]="o.level">{{o.name}}</mat-option>
		}
	</mat-select>
</mat-form-field>
