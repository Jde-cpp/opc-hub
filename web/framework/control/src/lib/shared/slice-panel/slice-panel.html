@if( field(); as f ){
	@if( folded() ){
		<button matButton type="button" class="slice-button" [matMenuTriggerFor]="valuesMenu"><mat-icon aria-hidden="true">vertical_split</mat-icon>Slice@if( heldLabel(); as label ){: {{ label }}}</button>
	}
	@else{
		<section [attr.aria-label]="'Slice by ' + f.label">
			<button matButton type="button" class="slice-field" [matMenuTriggerFor]="fieldMenu">{{ f.label }}<mat-icon aria-hidden="true" iconPositionEnd>expand_more</mat-icon></button>
			@if( failed() ){
				<p class="note" role="status">The counts could not be read.</p>
			}
			<ul>
				<li><button type="button" class="slice-row" [attr.aria-pressed]="held()===undefined" (click)="all()"><span class="label">All</span><span class="count">{{ total() }}</span></button></li>
				@for( row of rows(); track row.key ){
					<li><button type="button" class="slice-row" [class.none]="row.value===null" [attr.aria-pressed]="row.held" (click)="pick(row)"><span class="label">{{ row.label }}</span><span class="count">{{ row.count }}</span></button></li>
				}
			</ul>
		</section>
	}
	<mat-menu #valuesMenu="matMenu">
		<ng-template matMenuContent>
			<button mat-menu-item type="button" [matMenuTriggerFor]="fieldMenu">Slice by {{ f.label }}</button>
			<button mat-menu-item type="button" role="menuitemradio" [attr.aria-checked]="held()===undefined" (click)="all()">
				<mat-icon aria-hidden="true">{{ held()===undefined ? "check" : "" }}</mat-icon>
				All<span class="jde-slice-count">{{ total() }}</span>
			</button>
			@for( row of rows(); track row.key ){
				<button mat-menu-item type="button" role="menuitemradio" [attr.aria-checked]="row.held" (click)="pick(row)">
					<mat-icon aria-hidden="true">{{ row.held ? "check" : "" }}</mat-icon>
					{{ row.label }}<span class="jde-slice-count">{{ row.count }}</span>
				</button>
			}
		</ng-template>
	</mat-menu>
	<mat-menu #fieldMenu="matMenu">
		<ng-template matMenuContent>
			@for( choice of choices(); track choice.name ){
				<button mat-menu-item type="button" role="menuitemradio" [attr.aria-checked]="choice.name==f.name" (click)="sliceBy(choice.name)">
					<mat-icon aria-hidden="true">{{ choice.name==f.name ? "check" : "" }}</mat-icon>
					{{ choice.label }}
				</button>
			}
			<button mat-menu-item type="button" role="menuitemradio" aria-checked="false" (click)="sliceBy(undefined)">
				<mat-icon aria-hidden="true"></mat-icon>
				No slicing
			</button>
		</ng-template>
	</mat-menu>
}
