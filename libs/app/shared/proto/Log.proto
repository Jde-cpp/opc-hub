syntax = "proto3";
package Jde.App.Log.Proto;

import "google/protobuf/timestamp.proto";
import "Jde.IO.Records.proto";

enum ELogLevel{
	Trace = 0;
	Debug = 1;
	Information = 2;
	Warning = 3;
	Error = 4;
	Critical = 5;
	LogLevelNone = 6;
	NoLog = -1;
}

//The text fields are bytes, not string:  a log argument is whatever the code logged, and proto3 refuses to parse a string
//field holding invalid UTF-8.  Same wire type, so what was written as string - a poisoned daily file included - parses.
message LogEntryClient{
	bytes text=1;
	repeated bytes args=2;
	ELogLevel level=3;
	uint64 tags=4;
	uint32 line=5;
	google.protobuf.Timestamp time=6;
	uint32 user_pk=7;
	bytes file=8;
	bytes function=9;
}

message LogEntryFile{
	google.protobuf.Timestamp time=1;
	bytes template_id=2;
	repeated bytes args=3;
	ELogLevel level=4;
	uint64 tags=5;
	uint32 line=6;
	uint32 user_pk=7;
	bytes file_id=8;
	bytes function_id=9;
	int32 app_pk=10;
	int32 app_instance_pk=11;
}

message String{
	bytes id=1;
	bytes value=2;//bytes for the reason LogEntryClient's are:  as a string, one invalid UTF-8 argument made the whole daily file unparseable.
}

//The log's record, which its two files hold through the framework's record layer (include/jde/fwk/io/records):  each
//record on disk is its oneof member's field, tag, length and body, with no length prefix of its own, so a file parses
//as one FileEntry with every field repeated.  The daily file, log.binpb, is a live file:  its FileStart's ts is the
//time it was made, ns since the epoch, which names it to the archives (Merged), and each flush appends a run ending in
//a Checkpoint, with the Strings its entries name that the file doesn't hold yet, so a read of the whole file resolves
//its entries:  a String the writer has forgotten it wrote, or one a torn append held, can be written again.  A day's
//archive, <yyyy>/<m>/<d>/archive.binpb, is rewritten whole by each round that merges into it, generation 1 up:  its
//FileStart's ts is the day's start, then its Merged, then each String once, then the day's entries in time order, with
//no Checkpoint.  FileEntry never gains a field outside the oneof:  a build before it would read that as damage.
message FileEntry{
	oneof value{
		LogEntryFile entry=1; //normal entry, forwarded when app_pk is set.
		String str=2;	//for templates, files, functions, args.
		Jde.IO.Proto.FileStart file_start=3;//first in every file.
		Jde.IO.Proto.Checkpoint checkpoint=4;//the end of every append to the daily file.
		Merged merged=5;//an archive's second record.
	}
}

//Which daily file an archive has taken its entries from, by the FileStart ts that names it, and through which byte of
//it:  a round that is tried again, or runs again after a crash before the daily file's removal, adds none of those a
//second time.
message Merged{
	int64 daily=1;
	uint64 through=2;
}