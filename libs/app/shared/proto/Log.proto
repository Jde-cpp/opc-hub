syntax = "proto3";
package Jde.App.Log.Proto;

import "google/protobuf/timestamp.proto";

enum ELogLevel{
	Trace = 0;
	Debug = 1;
	Information = 2;
	Warning = 3;
	Error = 4;
	Critical = 5;
	LogLevelNone = 6;
	NoLog = -1;
}

message LogEntryClient{
	string text=1;
	repeated string args=2;
	ELogLevel level=3;
	uint64 tags=4;
	uint32 line=5;
	google.protobuf.Timestamp time=6;
	uint32 user_pk=7;
	string file=8;
	string function=9;
}

message LogEntryFile{
	google.protobuf.Timestamp time=1;
	bytes template_id=2;
	repeated bytes args=3;
	ELogLevel level=4;
	uint64 tags=5;
	uint32 line=6;
	uint32 user_pk=7;
	bytes file_id=8;
	bytes function_id=9;
	int32 app_pk=10;
	int32 app_instance_pk=11;
}

//Read only:  builds before 2026-10 wrote a forwarded entry as this.  A forwarded entry is now a LogEntryFile with a
//non-zero app_pk, and readers fold this one in through LogProto::ToEntry.
message LogEntryFileExternal{
	google.protobuf.Timestamp time=1;
	bytes template_id=2;
	repeated bytes args=3;
	ELogLevel level=4;
	uint64 tags=5;
	uint32 line=6;
	uint32 user_pk=7;
	bytes file_id=8;
	bytes function_id=9;
	int32 app_pk=10;
	int32 app_instance_pk=11;
}

message ArchiveFile{
	repeated LogEntryFile entries=1;
	repeated LogEntryFileExternal externalEntries=2;//read only - see LogEntryFileExternal.
	repeated String templates=3;
	repeated String files=4;
	repeated String functions=5;
	repeated String args=6;
}

message String{
	bytes id=1;
	string value=2;
}

message FileEntry{
	oneof value{
		LogEntryFile entry=1; //normal entry
		LogEntryFileExternal external_entry=2; //read only - see LogEntryFileExternal.
		String str=3;	//for templates, files, functions, args.
	}
}