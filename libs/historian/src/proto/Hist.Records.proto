syntax = "proto3";
package Jde.Opc.Hist.Proto;
import "Opc.Common.proto";
import "Jde.IO.Records.proto";

//A history file is the framework record layer's (include/jde/fwk/io/records):  each record its oneof member's field, tag,
//length and body, so the file parses as one HistoryRecord with every field repeated.  Times are UA ticks, 100 ns since
//1601.  Only the FileStart's is absolute:  every other record's primary time is a delta from the previous record's, and its
//other times are deltas from its own primary time.  Issued and Checkpoint have no time, so the chain passes over them.
//HistoryRecord never gains a field outside the oneof:  a build before it would read that as damage.
message HistoryRecord{
	oneof record{
		Jde.IO.Proto.FileStart file_start=1;//first in every file:  the start of its day in timeZone, which the first record's delta counts from.
		NodeAdded node_added=2;
		NodeRemoved node_removed=3;
		DataValue value=4;
		Modification modification=5;
		Jde.IO.Proto.Checkpoint checkpoint=6;//the end of every append to a live or modifications file.
		Issued issued=7;
	}
}

//An Issued group's, OpcServer's, right after the FileStart of each value file it makes:  the node_index it issues next.
//Absent from a gateway group's files, which take the host's indexes, and from modifications files.  It has no time.
message Issued{
	uint32 next_node_index=1;
}

//A node joining the group, or a current member at the start of a file, which alone carries a start value.  Primary time ts.
message NodeAdded{
	uint32 node_index=1;
	Jde.Opc.Proto.ExpandedNodeId node=2;//with its namespace URI; the namespace index is 0.
	sint64 ts=3;
	optional uint32 identity_id=4;//unset for a change the historian made itself; 4294967295 for the System identity.
	string user_name=5;
	DataValue start=6;
	//The built-in type (Part 6 5.1.2) the node's DataType gives its values, as the host read it, which an edit's values take:
	//an enumeration's is Int32, 6, and a subtype's its base's, as Duration's is Double, 11.  0 when the host hadn't read it,
	//or for an abstract DataType, whose values may be of any type.
	uint32 data_type=7;
}

message NodeRemoved{
	uint32 node_index=1;
	sint64 ts=2;
	optional uint32 identity_id=3;
	string user_name=4;
}

//A stored value, a heartbeat, or a Bad_DataLost marker, which has no value.  Its primary time is source_ts, or server_ts
//when the server sent no source timestamp.  Inside another record its node_index is that record's, left unset, and each
//of its times is a delta from that record's primary time.  A Good status, zero picoseconds or a null value is not stored,
//even when the UA DataValue's encoding mask has it, so a read returns it with the mask's bit clear.
message DataValue{
	uint32 node_index=1;
	optional sint64 source_ts=2;
	uint32 source_picoseconds=3;//10 ps intervals added to source_ts, as UA's.
	optional sint64 server_ts=4;
	uint32 server_picoseconds=5;
	uint32 status=6;
	Jde.Opc.Proto.Value value=7;
	optional sint64 heartbeat=8;//a heartbeat's:  the primary time of the value it repeats.
	bool heartbeat_unsourced=9;//that value came with no source timestamp, so heartbeat is its server_ts.
}

//Part 11's HistoryUpdateType.
enum UpdateType{
	UPDATE_TYPE_UNSPECIFIED=0;
	UPDATE_TYPE_INSERT=1;
	UPDATE_TYPE_REPLACE=2;
	UPDATE_TYPE_UPDATE=3;
	UPDATE_TYPE_DELETE=4;
}

//A value an edit changed, in the modifications file of target_source_ts's day.  Primary time target_source_ts.
message Modification{
	uint32 node_index=1;
	sint64 target_source_ts=2;
	UpdateType update_type=3;
	DataValue original=4;//none for an insert.
	DataValue new_value=5;//none for a delete.
	sint64 ts=6;//when the edit was made.
	optional uint32 identity_id=7;
	string user_name=8;
}