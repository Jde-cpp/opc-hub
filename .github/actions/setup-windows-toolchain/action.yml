name: Setup Windows toolchain
description: >-
  Provision the GitHub-hosted windows-2025 (VS2026) image for a clang/C++26
  Jde build: install LLVM 23 (the image ships 20.1.8, too old), fix the fixed
  build/dep paths + PATH, and emit the deterministic third-party deps cache key.
  Shared by win2025-deps.yml and win2025-build.yml so the toolchain and — most
  importantly — the cache key can never drift between the two workflows. This
  action does NOT build the third-party deps; the deps workflow does that.

outputs:
  deps-cache-key:
    description: Exact-match cache key for the third-party (-repos Release) install tree.
    value: ${{ steps.meta.outputs.deps-cache-key }}
  boost-version:
    description: Boost version to download (dotted, e.g. 1.91.0).
    value: ${{ steps.meta.outputs.boost }}
  boost-underscore:
    description: Boost version with underscores (e.g. 1_91_0), for the archive name.
    value: ${{ steps.meta.outputs.boost-underscore }}

runs:
  using: composite
  steps:
    # Fixed roots on the OS drive — short paths keep deep object files clear of
    # the 260-char limit. REPO_DIR mirrors the self-hosted layout so the presets
    # resolve installRoot=$REPO_DIR/install/$CXX exactly as they do locally.
    - name: Set environment
      shell: pwsh
      run: |
        @(
          "REPO_DIR=C:/jde/libs"
          "JDE_BUILD_DIR=C:/jde/build"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          "CXX=clang++"
        ) | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
        # Deep object paths under the CI build root can approach MAX_PATH; enable
        # long paths for both git (clones/checkout) and the Win32 API (compiler
        # output). Idempotent; the hosted runner account is elevated.
        git config --system core.longpaths true
        New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null

    # vcpkg.json's builtin-baseline (reviews/m4-closing.md #21) names a microsoft/vcpkg
    # commit, and the manifest install resolves openssl/sqlite3 through it - in *both*
    # workflows, since the -jde configure runs the manifest install too. The image's
    # C:/vcpkg clone sits at whatever commit the image was built with (09-04 as of
    # writing), and vcpkg reads the baseline out of git but every *version* entry off
    # the working tree - so fetching the commit alone leaves the older tree answering
    # "no version database entry for sqlite3 at 3.53.4#1". Check the pin out instead:
    # ports and version database then come from the one commit, which is what the pin
    # was for. bootstrap follows, because vcpkg.exe is gitignored - it stays the image's
    # build while the ports tree it now serves may want a newer tool.
    - name: Pin vcpkg to the baseline
      shell: pwsh
      run: |
        $baseline = (Get-Content "$env:GITHUB_WORKSPACE/vcpkg.json" -Raw | ConvertFrom-Json).'builtin-baseline'
        if( -not $baseline ){ Write-Host 'vcpkg.json has no builtin-baseline - leaving the image vcpkg as it is'; exit 0 }
        $root = $env:VCPKG_INSTALLATION_ROOT
        if( -not (Test-Path "$root/.git") ){ Write-Host "::error::$root is not a git clone, so the vcpkg builtin-baseline ($baseline) cannot resolve."; exit 1 }
        $head = (git -C $root rev-parse HEAD).Trim()
        if( $head -eq $baseline ){ Write-Host "vcpkg is already at the baseline $baseline"; exit 0 }
        Write-Host "vcpkg is at $head; checking out the baseline $baseline"
        git -C $root cat-file -e "$baseline^{commit}" 2>$null
        if( $LASTEXITCODE -ne 0 ){
          git -C $root fetch --no-tags --depth 1 origin $baseline
          if( $LASTEXITCODE -ne 0 ){ Write-Host "::error::could not fetch the vcpkg builtin-baseline $baseline - bump it in vcpkg.json to a commit microsoft/vcpkg still serves, or drop it."; exit 1 }
        }
        git -C $root checkout --force --detach $baseline
        if( $LASTEXITCODE -ne 0 ){ Write-Host "::error::could not check out the vcpkg builtin-baseline $baseline in $root."; exit 1 }
        & "$root/bootstrap-vcpkg.bat" -disableMetrics
        if( $LASTEXITCODE -ne 0 ){ Write-Host "::error::bootstrap-vcpkg failed after checking out $baseline."; exit 1 }
        Write-Host "vcpkg pinned to $baseline ($(git -C $root log -1 --format=%cs))"

    # Single source of truth for the pinned tool versions AND the deps cache key.
    # build/CMakeLists.txt holds every dependency GIT_TAG, so bumping any dep (or
    # a preset / vcpkg manifest) changes the hash -> a fresh, non-colliding cache.
    # Except the product version: CMakePresets.common.json's JDE_VERSION is blanked
    # before hashing. No dependency is built from it (build/CMakeLists.txt only names
    # its project() with it), and hashing it made every version bump a cache miss
    # that failed the tag's build until "Win2025 Deps" ran on main again.
    - name: Compute versions and deps cache key
      id: meta
      shell: pwsh
      run: |
        $llvm  = "23.1.1"
        $boost = "1.91.0"
        $boostU = $boost -replace '\.','_'
        # hashFiles' inputs, hashed here instead so the version can be left out. LF
        # line ends and repo-relative names, so any checkout computes the same key;
        # APIs Windows PowerShell 5.1 has too, so the same lines can be checked off CI.
        $files = @( Get-ChildItem -File -Path CMakePresets*.json | ForEach-Object Name ) + 'build/CMakeLists.txt', 'build/functions.cmake', 'vcpkg.json'
        $text = foreach( $f in ($files | Sort-Object) ){
          $content = (Get-Content -Raw -Encoding UTF8 -LiteralPath $f) -replace "`r`n", "`n"
          $content = $content -replace '("JDE_VERSION"\s*:\s*)"[^"]*"', '$1""'
          "--- $f`n$content"
        }
        $bytes = [Text.Encoding]::UTF8.GetBytes( ($text -join "`n") )
        $hash = -join ( [Security.Cryptography.SHA256]::Create().ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') } )
        $key = "windows-deps-release-llvm$llvm-boost$boost-$hash"
        @(
          "llvm=$llvm"
          "boost=$boost"
          "boost-underscore=$boostU"
          "deps-cache-key=$key"
        ) | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
        Write-Host "deps cache key: $key"

    # LLVM 23 is cached as a plain tool (keyed only on version) — this is the
    # compiler, not the third-party deps, so restoring it in the build workflow
    # does not weaken the strict "deps must come from the deps workflow" rule.
    - name: Cache LLVM ${{ steps.meta.outputs.llvm }}
      id: llvm-cache
      uses: actions/cache@v4
      with:
        path: C:/llvm23
        key: llvm-${{ steps.meta.outputs.llvm }}-x86_64-pc-windows-msvc

    - name: Install LLVM ${{ steps.meta.outputs.llvm }}
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ver = "${{ steps.meta.outputs.llvm }}"
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/clang+llvm-$ver-x86_64-pc-windows-msvc.tar.xz"
        $xz  = "$env:RUNNER_TEMP/llvm.tar.xz"
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile $xz
        New-Item -ItemType Directory -Force -Path C:/llvm23 | Out-Null
        # bsdtar on the image decompresses .xz in one pass; strip the top
        # clang+llvm-<ver>-... dir so bin/ lands directly at C:/llvm23/bin.
        tar -xf $xz -C C:/llvm23 --strip-components=1
        if ($LASTEXITCODE -ne 0) { throw "LLVM extract failed" }

    # PATH runs on both hit and miss so clang++/ld.lld are always resolvable.
    - name: Add LLVM to PATH
      shell: pwsh
      run: |
        "C:/llvm23/bin" | Add-Content -Path $env:GITHUB_PATH -Encoding utf8

    - name: Report toolchain
      shell: pwsh
      run: |
        clang++ --version
        cmake --version
        ninja --version
