name: Win11

# Manual-only: builds + tests on the self-hosted Windows 11 workstation runner
# (label win11-clang). Unlike the Linux runner it is a real workstation, not an
# ephemeral container, so it runs only on explicit request (workflow_dispatch) —
# never automatically on push/PR. workflow_dispatch is gated to users with write
# access, so no fork-PR fence is needed.
#
# Runner prerequisites (see .github/win11-runner.md):
#   - The runner (jde-ci-win11, C:\actions-runner) is installed as a Windows
#     service via `config.cmd --runasservice`, running as the dev account. GitHub
#     deletes a self-hosted runner that stays disconnected for 14 days, which is
#     what happened to the interactive run.cmd registration of 2026-07 — a
#     dispatch then queues forever.
#   - LLVM clang++ / ld.lld 23, CMake >=4.2.3, Ninja on the *service* PATH. On
#     this box LLVM is on the user PATH only, hence the dev-account service.
#   - functions.cmake makes one configure-time symlink for the static config
#     files (file(CREATE_LINK … SYMBOLIC)); Developer Mode is on, which lets any
#     non-elevated process create symlinks — otherwise the service account needs
#     SeCreateSymbolicLinkPrivilege.
#   - Prebuilt third-party trees present: %REPO_DIR%\install\clang++\Debug,
#     %REPO_DIR%\boostorg\boost_1_91_0, %VCPKG_ROOT%\installed, %UA_NODE_SETS%.
on:
  workflow_dispatch:

# Supersede an older manual run of the same ref (a single self-hosted runner
# serializes jobs anyway; this just avoids a stale queued run).
concurrency:
  group: win11-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # This becomes the check-run name on the commit the run was dispatched against,
    # which is what the README badge filters on (shields.io …?nameFilter=Win11).
    # Keep it unique across workflows and in sync with the badge URL.
    name: Win11
    runs-on: [self-hosted, win11-clang]
    defaults:
      run:
        # Windows PowerShell 5.1 (always present); this self-hosted box has no
        # pwsh (PS7). The steps below use no PS7-only syntax.
        shell: powershell

    env:
      # CI-only build root — separate from the local dev build
      # (x:\build\clang++\opc-hub\debug) so the two never collide. The preset
      # appends \clang++\${sourceDirName}\debug, and the runner checks out to
      # ...\_work\opc-hub\opc-hub, so the real build dir is BUILD_DIR below.
      JDE_BUILD_DIR: C:/Users/duffyj/source/build/ci
      REPO_DIR: C:/Users/duffyj/source/repos/libs
      VCPKG_ROOT: C:/Users/duffyj/source/repos/libs/vcpkg
      UA_NODE_SETS: C:/Users/duffyj/source/repos/libs/UA-Nodeset
      PRESET: win-clang-debug-jde
      BUILD_DIR: C:/Users/duffyj/source/build/ci/clang++/opc-hub/debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      # The preset sets binaryDir, so no -B / reconfig needed.
      - name: Configure
        run: cmake --preset $env:PRESET

      - name: Build
        # protoc used to generate in-source (PROTOC_OUT_DIR = <lib>/proto), where a
        # *.pb.h was both a build output and a header other targets #include. A
        # consumer compile could hold one open for read while protoc rewrote it;
        # on Windows that share-locks protoc's output and fails the build
        # ("<file>: Invalid argument"), latent on Linux (POSIX allows the
        # concurrent open). Generation moved to the build tree 2026-08-14
        # (reviews/todo.md §4 option 1), so no generated header sits in the source
        # tree any more.
        #
        # The serial retry stays as a CANARY, not a crutch: the race is
        # intermittent, so "it stopped failing" is weak evidence. If the warning
        # below ever fires again, out-of-source generation was not sufficient and
        # the real fix is the cross-target ordering edges (todo.md §4 option 2) —
        # moving the output does not by itself stop an unrelated target from
        # reading a generated header while protoc writes it. Drop this fallback
        # once enough clean parallel runs have gone green without it firing.
        run: |
          cmake --build "$env:BUILD_DIR" -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Parallel build failed once after the out-of-source proto move; completing serially (-j 1). See reviews/todo.md §4 - this means ordering edges are still needed."
            cmake --build "$env:BUILD_DIR" -j 1
          }

      - name: Test
        # Serial (no -j): suites share WORKING_DIRECTORY (<build>/Testing) and
        # thus logs/ + sqlite-tests.db. DB suites use in-memory sqlite → no DB
        # server. --no-tests=error flags a mis-built/empty suite instead of
        # silently passing.
        run: ctest --test-dir "$env:BUILD_DIR" --output-on-failure --no-tests=error

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-windows11-${{ github.run_id }}
          path: ${{ env.BUILD_DIR }}/Testing/logs/**
          if-no-files-found: ignore
          retention-days: 7
