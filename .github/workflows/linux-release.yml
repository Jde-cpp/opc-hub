name: Linux Release

# Builds the release tree (linux-clang-relWithDebInfo-jde, the app targets only) on the self-hosted, containerised
# runner (.github/docker/) and packages it with apps/OpcHub/setup/linux/build-deb.sh: a push of a `yyyy.MM.dd` tag publishes
# the .deb and the per-user tarball on that tag's GitHub release - beside the Windows installer win2025-build.yml puts
# there - and any other run uploads them as an artifact. The Web UI comes from the `web` job, a GitHub-hosted `ng build`, as in
# the Windows workflow. Dispatch it by hand (Actions -> Linux Release -> Run workflow, any branch; gated to users with
# write access, so no fork-PR fence is needed) or push a tag.
on:
  workflow_dispatch:
  push:
    tags: ['20*']

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Angular site the package ships (opt/jde-cpp/web):  .github/actions/build-web, a from-scratch scaffold every run (~5 min).
  # GitHub-hosted:  the runner image has no node.
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and upload the site
        uses: ./.github/actions/build-web
        with:
          release: ${{ github.ref_type == 'tag' }} # a tag run is a release:  hashed output names
          artifact: web-dist-${{ github.run_id }} # what the build job below packs

  build:
    name: Linux Release
    # `needs:` puts the ~5 min site build ahead of this one instead of beside it (what the Windows workflow's poll
    # avoids) - the release build here is a fraction of the debug one.  The container has `gh` (the myoung34 base image's)
    # should a poll ever pay.
    needs: web
    # Matches the LABELS set when the runner container was registered.
    runs-on: [self-hosted, clang23]
    permissions:
      contents: write # the Release step; read is all checkout needs

    env:
      JDE_DIR: ${{ github.workspace }}
      JDE_BASH: ${{ github.workspace }}
      JDE_COMPILER: clang++
      # Container-local tmpfs (mounted at `docker run`), so each job builds clean.
      JDE_BUILD_DIR: /mnt/ram/linux
      # Bind-mount point of the host's third-party install tree; the presets read $REPO_DIR/install/clang++/RelWithDebInfo.
      REPO_DIR: /deps
      # UA_NODE_SETS is the Nodesets step's download, not the host's bind-mounted clone (reviews/m4-closing.md #21).
      PRESET: linux-clang-relWithDebInfo-jde

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0 # the tags: the package's version is `git describe --tags`

      - name: Resolve build dir
        shell: bash
        run: echo "BUILD_DIR=$JDE_BUILD_DIR/$JDE_COMPILER/$(basename "$JDE_DIR")/release" >> "$GITHUB_ENV"

      # Not buildFunctions.sh's reconfig: it takes no extra cache variables, and the test targets are not wanted here.
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/runtime/logs"
          cmake -B "$BUILD_DIR" -S "$JDE_DIR" -Wno-dev --preset "$PRESET" -Djde_TESTS=OFF

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" -j "$(nproc)" --target Jde.Opc.Hub Jde.Opc.Server Jde.DB.Sqlite Jde.DB.Sqlite.AppServer Jde.DB.Sqlite.OpcGateway Jde.DB.MySql

      - name: Download the Web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/web

      # The DI/IA nodesets the package installs for the OpcServer, at the commit win2025-build.yml's Installer inputs
      # pins - change the two together.  They came from the host's bind-mounted UA-Nodeset clone, which is whatever the
      # host last pulled:  it did not even contain the Windows pin, so the two platforms shipped different nodesets, and a
      # tag re-run shipped whatever the host had moved to (reviews/m4-closing.md #21).  linux-ci's tests still read the mount.
      - name: Nodesets
        run: |
          raw=https://raw.githubusercontent.com/OPCFoundation/UA-Nodeset/4a6f0c8e9790116eb2eb4511ae688109ee281934
          for f in DI/Opc.Ua.Di.NodeSet2.xml IA/Opc.Ua.IA.NodeSet2.xml IA/Opc.Ua.IA.NodeSet2.examples.xml; do
            mkdir -p "$RUNNER_TEMP/UA-Nodeset/$(dirname $f)"
            wget -q -O "$RUNNER_TEMP/UA-Nodeset/$f" "$raw/$f" || { echo "download failed: $f"; exit 1; }
          done
          echo "UA_NODE_SETS=$RUNNER_TEMP/UA-Nodeset" >> "$GITHUB_ENV"
          echo "UA-Nodeset: \`4a6f0c8e\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # a tag names the version outright; otherwise build-deb.sh takes `git describe --tags`
          version=""; [ "$GITHUB_REF_TYPE" = tag ] && version="$GITHUB_REF_NAME"
          bash apps/OpcHub/setup/linux/build-deb.sh --build-dir "$BUILD_DIR" --web-dist "$RUNNER_TEMP/web" --ua-nodesets "$UA_NODE_SETS" \
            --out-dir "$RUNNER_TEMP/setup" --version "$version" --maintainer "Jde-Cpp <noreply@jde-cpp.invalid>"

      - name: Upload the package
        if: github.ref_type != 'tag' # a tag run publishes it on the release instead
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/setup/*.deb
            ${{ runner.temp }}/setup/*.tar.gz
          if-no-files-found: error
          retention-days: 90

      # A tag run publishes the package on the tag's GitHub release - created here if the Windows workflow has not
      # already, the files replaced when the run is repeated. A new release's notes open with the code signing policy
      # link SignPath wants on the download page, above GitHub's generated notes, as win2025-build.yml writes them. gh
      # (the myoung34 base image's) rather than softprops/action-gh-release, which on a release that exists regenerates
      # the notes and appends them to what is there - the Windows workflow's, or a hand edit.
      - name: Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CODE_SIGNING_LINE: '[Code signing policy](${{ github.server_url }}/${{ github.repository }}/blob/main/CODE_SIGNING.md)'
        run: |
          files=( "$RUNNER_TEMP"/setup/*.deb "$RUNNER_TEMP"/setup/*.tar.gz )
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --notes "$CODE_SIGNING_LINE" --generate-notes
          fi