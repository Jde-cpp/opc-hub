name: Win2025

# Builds the repository's own exe/DLLs (win-clang-release-jde) on the
# GitHub-hosted windows-2025 (VS2026) image, consuming the third-party deps
# tree that win2025-deps.yml built and cached. Strict coupling: if the deps
# cache is missing this workflow fails fast — it never builds deps itself.
# Run "Win2025 Deps" on `main` first (and after any dep/preset bump).
#
# Dispatch it manually (Actions -> Win2025 -> Run workflow), picking the
# branch to build - workflow_dispatch is gated to users with write access, so
# no fork-PR fence is needed - or push a release tag (yyyy.MM.dd). Every run
# also builds the Windows installer (apps/OpcHub/setup) as an artifact -
# unsigned, no certificate route yet (apps/OpcHub/setup/README.md, "Signing"); a tag
# run publishes it as that tag's GitHub release. The deps-cache coupling holds
# for tag runs too: GitHub evicts caches unused for 7 days, so after a quiet
# stretch re-run "Win2025 Deps" before tagging.
on:
  workflow_dispatch:
  push:
    tags: ['20*']

concurrency:
  group: win2025-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Angular site the installer ships (its Web UI component). web/opc/scripts/setup.sh
  # scaffolds the workspace (`ng new`, Material, ts-proto/buf for the generated proto
  # package - all from npm), links the tracked sources in and runs `ng build`; nothing
  # of the workspace is tracked, so this is a from-scratch scaffold every run (~5 min).
  # Linux on purpose: the scaffold symlinks and hard-links, which a Windows runner
  # would need Developer Mode for. Runs beside the Windows build, not ahead of it -
  # the Installer step below waits for it.
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26 # @angular/cli 22 takes ^22.22 || ^24.15 || >=26; the dev box is on 26

      # The global cli decides which Angular `ng new` scaffolds (create-workspace.sh
      # pins everything to it), so pin the major the libraries' peer ranges name
      # (web/*/control/package.json: ^22.1.0) rather than let it install @latest.
      - name: Build the site
        env:
          JDE_BASH: ${{ github.workspace }}
        run: |
          npm install -g @angular/cli@22
          # a tag run is a release: hashed output names, which the hub serves as immutable; other runs keep main.js
          release=""; if [ "$GITHUB_REF_TYPE" = tag ]; then release=--release; fi
          bash web/opc/scripts/setup.sh $release

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: web/opc/my-workspace/dist/my-workspace/browser
          if-no-files-found: error
          retention-days: 7

  build:
    # This becomes the check-run name on the commit the run was dispatched against,
    # which is what the README badge filters on (shields.io …?nameFilter=Win2025).
    # Keep it unique across workflows and in sync with the badge URL.
    name: Win2025
    runs-on: windows-2025
    permissions:
      contents: write # the Release step; read is all checkout needs
      actions: read # `gh run view` in the Web UI wait step
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0 # the tags: the installer's version is `git describe --tags`

      - name: Setup Windows toolchain
        id: toolchain
        uses: ./.github/actions/setup-windows-toolchain

      # Strict restore: exact key only, no restore-keys. A miss leaves the paths
      # empty and the guard below fails the job with an actionable message.
      - name: Restore deps cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.toolchain.outputs.deps-cache-key }}
          path: |
            C:/jde/libs/install/clang++/Release
            C:/jde/libs/boostorg/boost_1_91_0
            C:/vcpkg/installed

      - name: Require deps cache
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          Write-Host "::error::Third-party deps cache missing for key '${{ steps.toolchain.outputs.deps-cache-key }}'. Run the 'Win2025 Deps' workflow on main first (it builds + caches the -repos Release tree). A dep/preset bump on this branch also invalidates the key until deps is re-run."
          exit 1

      - name: Configure
        run: cmake --preset win-clang-release-jde

      - name: Build
        # protobuf generates in-source (PROTOC_OUT_DIR = <lib>/proto); under full
        # parallelism a consumer compile can hold a *.pb.h open while protoc
        # rewrites it, which Windows share-locks ("<file>: Invalid argument"). If
        # the parallel pass fails, finish serially (-j 1, race-free) — a genuine
        # compile error still fails the serial pass, so nothing is masked.
        run: |
          $buildDir = "C:/jde/build/clang++-jde/release"
          cmake --build $buildDir -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Parallel build failed once (in-source protobuf codegen race); completing serially (-j 1)."
            cmake --build $buildDir -j 1
          }

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-binaries-${{ github.run_id }}
          # functions.cmake redirects all exe/DLL/lib/pdb output to <build>/bin.
          path: C:/jde/build/clang++-jde/release/bin/**
          if-no-files-found: error
          retention-days: 7

      # The installer (apps/OpcHub/setup/build-setup.ps1). The windows-2025 image
      # has no NSIS - choco installs it (~30 s); the OpcServer's DI/IA nodesets
      # come from OPCFoundation/UA-Nodeset at a pinned commit (linux-release.yml's
      # Nodesets step takes the same one - change the two together), the VC++
      # runtime from Microsoft, and the Web UI from the `web` job.  NSIS is pinned
      # to 3.11.0; the runtime cannot be (aka.ms serves Microsoft's latest 14.5x),
      # so its version is read off the file - into the installer's text by
      # build-setup.ps1, and into the job summary with NSIS's and vcpkg's baseline
      # (reviews/m4-closing.md #21).
      # The runtime is the VS 2026 line (aka.ms/vs/18, 14.5x): the image builds
      # with the VS 2026 toolset (VC/Tools/MSVC/14.51), and Microsoft's rule is a
      # redistributable at least as new as the toolset. The VS 2022 line (vs/17,
      # 14.44) happened to export every symbol the exes import - checked 09-12 -
      # but only by luck. OpcHubSetup.nsi's version gate (14.50) is the same line.
      - name: Installer inputs
        if: success()
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis --version 3.11.0 -y --no-progress }
          New-Item -ItemType Directory -Force C:/jde/nodesets/DI, C:/jde/nodesets/IA | Out-Null
          $raw = 'https://raw.githubusercontent.com/OPCFoundation/UA-Nodeset/4a6f0c8e9790116eb2eb4511ae688109ee281934'
          foreach ($f in 'DI/Opc.Ua.Di.NodeSet2.xml', 'IA/Opc.Ua.IA.NodeSet2.xml', 'IA/Opc.Ua.IA.NodeSet2.examples.xml') {
            curl.exe -sSfL "$raw/$f" -o "C:/jde/nodesets/$f"
            if ($LASTEXITCODE -ne 0) { throw "download failed: $f" }
          }
          curl.exe -sSfL https://aka.ms/vs/18/release/vc_redist.x64.exe -o C:/jde/vc_redist.x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'download failed: vc_redist.x64.exe' }
          $redist = (Get-Item C:/jde/vc_redist.x64.exe).VersionInfo.ProductVersion
          $nsis = (Get-Item 'C:\Program Files (x86)\NSIS\makensis.exe').VersionInfo.ProductVersion
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "Installer inputs: vc_redist ``$redist``, NSIS ``$nsis``, vcpkg baseline ``$baseline``, UA-Nodeset ``4a6f0c8e``" >> $env:GITHUB_STEP_SUMMARY

      # The `web` job normally finishes long before the C++ build does; this is the
      # guard for the day it does not (or fails) - a `needs:` would instead put its
      # ~5 min ahead of the 20-min build.
      - name: Wait for the Web UI
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = ''
          foreach ($i in 1..45) {
            $state = gh run view ${{ github.run_id }} --json jobs --jq '.jobs[] | select(.name == "Web UI") | .status + " " + (.conclusion // "")'
            if ($state -like 'completed*') { break }
            Start-Sleep -Seconds 20
          }
          if ($state.Trim() -ne 'completed success') { throw "Web UI job: '$state'" }

      - name: Download the Web UI
        if: success()
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: C:/jde/web

      - name: Installer
        if: success()
        run: |
          # a tag names the version outright; otherwise build-setup.ps1 takes `git describe --tags`
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./apps/OpcHub/setup/build-setup.ps1 -BuildDir C:/jde/build/clang++-jde/release -UaNodeSets C:/jde/nodesets -VcRedist C:/jde/vc_redist.x64.exe -WebDist C:/jde/web -OutDir C:/jde/setup -Version $version

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.run_id }}
          path: C:/jde/setup/OpcHubSetup-*.exe
          if-no-files-found: error
          retention-days: 7

      # A tag run publishes the installer as the tag's GitHub release - created
      # here, or the file replaced when the run is repeated.
      - name: Release
        if: success() && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $exe = (Get-Item C:/jde/setup/OpcHubSetup-*.exe).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $exe --clobber } else { gh release create $tag $exe --title $tag --generate-notes }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
